[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "resumable-api-batch-extractor"
version = "0.1.1"
description = "Synthetic resumable API batch extractor with cursor checkpoints, retry and idempotent NDJSON output."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Guilherme Lacerda" }]
dependencies = [
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
resumable-extractor-demo = "resumable_api_batch_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["resumable_api_batch_extractor"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 88
